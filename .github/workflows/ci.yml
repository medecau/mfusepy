name: Tests

on:
  push:
    branches: '**'
    tags-ignore: '**'
  pull_request:

jobs:
  Static-Code-Checks:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Static checks (ruff + ty via poe)
        run: uv run poe check

  Tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # https://endoflife.date/python
        include:
          - os: ubuntu-22.04
            python-version: '3.9'
          - os: ubuntu-22.04-arm
            python-version: '3.10'
          - os: ubuntu-22.04
            python-version: '3.11'
          - os: ubuntu-24.04-arm
            python-version: '3.12'
          - os: ubuntu-24.04
            python-version: '3.13'
          - os: ubuntu-24.04
            python-version: '3.14'
          - os: macos-15
            python-version: '3.9'
          - os: macos-14
            python-version: '3.10'
          - os: macos-15-intel
            python-version: '3.11'
          - os: macos-14
            python-version: '3.12'
          - os: macos-15-intel
            python-version: '3.13'
          - os: macos-15
            python-version: '3.14'

    env:
      MFUSEPY_CHECK_OVERRIDES: 1
    defaults:
      run:
        # This is especially important for windows because it seems to default to powershell
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # We need one tag for testing the git mount.
          # https://github.com/actions/checkout/issues/1781
          fetch-tags: true

      - name: Set up uv (with Python ${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Dependencies (Linux)
        if: startsWith( matrix.os, 'ubuntu' )
        run: sudo apt-get -y install libfuse2 libfuse-dev libfuse3-dev fuse3 wget

      - name: Install Dependencies (MacOS)
        if: startsWith( matrix.os, 'macos' )
        run: brew install -q macfuse

      - name: Install test dependencies
        run: uv sync --group test

      - name: Test Installation From Tarball
        run: |
          uv build
          uv pip install --python "$(uv python find ${{ matrix.python-version }})" "$(find dist -name '*.tar.gz' | head -1)"

      - name: Test Import
        run: uv run --no-sync python -c 'import mfusepy'

      - name: Examples
        run: |
          # Simply parsing the source runs the @overrides check.
          for file in examples/*.py; do
              uv run python "$file" -h
          done

      - name: Only test struct layout (MacOS)
        if: startsWith( matrix.os, 'macos' )
        run: uv run pytest -s -v -rs tests/test_struct_layout.py

      - name: Unit Tests (FUSE 2)
        if: startsWith( matrix.os, 'ubuntu' )
        run: |
          uv run python -c 'import mfusepy; assert mfusepy.fuse_version_major == 2'
          uv run pytest -v -rs tests

      - name: Unit Tests (FUSE 3)
        if: startsWith( matrix.os, 'ubuntu' )
        run: |
          export FUSE_LIBRARY_PATH=$( dpkg -L libfuse3-3 | 'grep' -F .so | head -1 )
          uv run python -c 'import mfusepy; assert mfusepy.fuse_version_major == 3'
          uv run pytest -v -rs tests

      - name: Test Compatibility (Ratarmount)
        if: startsWith( matrix.os, 'ubuntu' )
        run: |
          uv run --with ratarmount python -c 'import ratarmount'
          mkdir -p mounted-tar
          uv run --with ratarmount ratarmount tests/single-file.tar mounted-tar
          [[ "$( cat mounted-tar/bar )" == "foo" ]]
          fusermount -u mounted-tar

      - name: Test Compatibility (ninfs)
        if: ${{ startsWith( matrix.os, 'ubuntu' ) && matrix.python-version != '3.7' }}
        run: |
          # https://github.com/ihaveamac/ninfs/commit/9554caa5ecb325a9893bce829fb17efc73d3622c
          # ^ Increases requirement from 3.8 to 3.12 seemingly for no reason at all. There is no commit after it...
          mkdir -p mounted-3dsx
          uv run --with 'git+https://github.com/ihaveamac/ninfs.git@v2.0' ninfs threedsx tests/3dsfetch.3dsx mounted-3dsx
          [[ "$( md5sum mounted-3dsx/icon.smdh )" =~ "a3d784b6f20182ebdf964589cbf427c2" ]]
          fusermount -u mounted-3dsx

  VM-Tests:
    # Run tests inside a VM using cross-platform-actions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
         include:
           - os: freebsd
             version: '14.3'
             display_name: FreeBSD
           - os: freebsd
             version: '13.5'
             display_name: FreeBSD
           - os: openbsd
             version: '7.7'
             display_name: OpenBSD
           # OpenBSD 6.9 is not supported because it only has Python 3.8, which is not supported anymore.
           # NetBSD 9.4 is not supported because its interface seems to mirror libFUSE 2.6 and therefore is HIGHLY
           #            incompatible. Even fuse_context.umask is missing!
           - os: netbsd
             version: '10.1'
             display_name: NetBSD


    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Test on ${{ matrix.display_name }}
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          shell: bash
          run: |
            set -euxo pipefail
            case "${{ matrix.os }}" in
              freebsd)
                sudo -E /bin/sh -c 'grep -q "freebsd\.local" /etc/hosts || echo "127.0.0.1 freebsd.local freebsd" >> /etc/hosts'
                sudo -E hostname freebsd.local
                hostname

                export IGNORE_OSVERSION=yes

                sudo -E pkg update -f
                sudo -E pkg install -y git fusefs-libs python3 python311 py311-pip

                sudo -E kldload fusefs
                sudo -E sysctl vfs.usermount=1
                sudo -E chmod 666 /dev/fuse

                # uv has no FreeBSD wheels (building from sdist needs Rust), and
                # `uv sync --group test` would also drag in paramiko -> cryptography,
                # which likewise needs Rust. Use the system Python and install only
                # the pure-Python deps the suite actually imports.
                python3 -m pip install pytest pytest-order ioctl-opt
                python3 -m pip install .
                python3 -c 'import mfusepy; assert mfusepy.fuse_version_major == 2'
                python3 -m pytest -s -v -rs tests
                ;;
              openbsd)
                sudo -E /bin/sh -c 'grep -q "openbsd\.local" /etc/hosts || echo "127.0.0.1 openbsd.local openbsd" >> /etc/hosts'
                sudo -E hostname openbsd.local
                hostname

                sudo -E pkg_add git py3-pip py3-virtualenv py3-tox
                sudo -E pkg_add sshfs-fuse  # needed for sideeffect of having fuse 2.6?

                # uv has no OpenBSD wheels and the system Python is PEP-668
                # externally-managed, so use a venv with the system Python and
                # install only the pure-Python deps the suite imports (paramiko,
                # pulled in by the `test` group, would need Rust to build here).
                python3 -m venv .venv
                . .venv/bin/activate
                python3 -m pip install pytest pytest-order ioctl-opt
                python3 -m pip install .
                python3 -c 'import mfusepy; assert mfusepy.fuse_version_major == 2'

                # FUSE mounting only works as root on OpenBSD
                sudo -E .venv/bin/python3 -m pytest -s -v -rs tests
                ;;
              netbsd)
                sudo -E /bin/sh -c 'grep -q "netbsd\.local" /etc/hosts || echo "127.0.0.1 netbsd.local netbsd" >> /etc/hosts'
                sudo -E hostname netbsd.local
                hostname

                sudo -E pkgin -y update
                sudo -E pkgin -y install git fuse perfuse python311 py311-pip
                sudo -E ln -sf /usr/pkg/bin/python3.11 /usr/pkg/bin/python3

                export PATH="/usr/pkg/bin:/usr/pkg/sbin:/sbin:/usr/sbin:$PATH"

                sudo sysctl -w vfs.generic.usermount=1
                sudo sysctl -w kern.sbmax=4194304
                sudo chmod 666 /dev/puffs

                # avoid permissions issue for perfused trace file:
                sudo chmod 777 /var/run

                # uv has no NetBSD wheels (building from sdist needs Rust), and the
                # `test` group's paramiko -> cryptography would also need Rust. Use
                # the system Python with only the pure-Python deps the suite imports.
                python3 -m pip install pytest pytest-order ioctl-opt
                python3 -m pip install .

                # preserve pytest exit status, always show logs
                rc=0
                python3 -m pytest -s -v -rs tests/test_struct_layout.py
                # for now, run the tests as root, too many PermissionErrors:
                sudo -E python3 -m pytest -s -v -rs tests || rc=$?
                exit "$rc"
                ;;
            esac
