[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mfusepy"
version = "3.1.1"
description = "Ctypes bindings for the high-level API in libfuse 2 and 3"
authors = [{name = "Maximilian Knespel", email = "mxmlnknp@gmail.com"}]
license = {text = "ISC"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: BSD :: OpenBSD",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
]
urls = {Homepage = "https://github.com/mxmlnkn/mfusepy"}
requires-python = ">= 3.9"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.hatch.build.targets.wheel]
only-include = ["mfusepy.py"]

[tool.hatch.build.targets.sdist]
include = [
    "mfusepy.py",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "examples/",
    "tests/",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-order",
    "ioctl-opt",
    "paramiko",
    "types-paramiko",
]
typecheck = ["ty"]
dev = [
    {include-group = "test"},
    {include-group = "typecheck"},
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "A", "B", "E", "F", "G", "I", "W", "N", "ASYNC", "C4", "COM", "FLY", "FURB",
    "ICN", "INT", "ISC", "LOG", "PERF", "PIE", "PLW", "PT", "PYI", "RET", "RSE",
    "RUF", "SIM", "TID", "TC", "UP", "YTT",
]
ignore = [
    "E501",     # Line length is the formatter's concern, not the linter's.
    "F401",     # `from .version import __version__ as __version__` style re-exports.
    "B904",     # `raise X from Y` not enforced; many `raise FuseOSError(...)` sites are clearer without it.
    "N801",     # Some class names are snake_case to match ctypes.
    "COM812",   # Trailing commas conflict with formatter.
    "PLW0603",  # `global` statements are unavoidable in subprocess wrappers.
    "PT017",
    "RET504",   # https://github.com/astral-sh/ruff/issues/17292#issuecomment-3039232890
    "RUF012",   # ctypes `_fields_` is not actually mutable but ruff doesn't know.
    "SIM102",   # Nested if-statements are sometimes more readable.
    "SIM105",
    "SIM118",   # Bug: removes `.keys()` from sqlite3.Row, which is not a dict.
]
fixable = ["ALL"]
unfixable = []
external = ["W212"]

[tool.ruff.lint.per-file-ignores]
"tests/test_enoattr.py" = ["E402"]
"tests/test_examples.py" = ["E402"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
enable_assertion_pass_hook = true
